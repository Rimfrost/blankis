<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Blankis</title>
<style>
:root {
  color-scheme: dark;
  --void: #060a10;
  --frame: #142030;
  --frame-hi: #2e4560;
  --ink: #e8f0f8;
  --dim: #7f98b4;
  --ice: #9fe0ff;
  --font-px: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--void); color: var(--ink); font-family: var(--font-px); }
.wrap {
  min-height: 100%; box-sizing: border-box; padding: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.screen {
  width: min(100%, 1200px, calc((100vh - 170px) * 1.6));
  min-width: min(100%, 280px);
  aspect-ratio: 16 / 10; box-sizing: border-box;
  border: 4px solid var(--frame); outline: 2px solid var(--frame-hi);
  background: #0a121c;
}
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
.legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; max-width: 1200px;
  font-size: 12px; line-height: 1.6; color: var(--dim); text-align: center;
}
.legend b { color: var(--ice); font-weight: normal; }
.pad { display: none; gap: 8px; }
.pad button {
  min-width: 0; font: 15px var(--font-px); color: var(--ink);
  background: var(--frame); border: 3px solid var(--frame-hi); border-radius: 10px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.pad button.main { color: var(--ice); }
.pad button.on { background: var(--frame-hi); }
button:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
.mute { display: none; }

/* ---------- mobile ---------- */
.screen { position: relative; }
.steer { display: none; }
@media (pointer: coarse) {
  html, body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { position: fixed; inset: 0; overflow: hidden; }
  .legend { display: none; }
  .pad { display: grid; }
  .wrap {
    height: 100%; min-height: 0; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  .pad button.mute { display: block; font-size: 11px; color: var(--dim); height: 32px; }
  /* steering: two small see-through buttons inside the picture, bottom left, side by side */
  body[data-state="skate"] .steer, body[data-state="rescue"] .steer {
    display: flex; position: absolute; left: 2.5%; bottom: 14%; gap: 8px; width: max(26%, 104px);
  }
  .steer button {
    flex: 1; aspect-ratio: 1; min-width: 0; padding: 0; font-size: 20px; color: var(--ink);
    background: rgba(12,22,34,0.45); border: 2px solid rgba(159,224,255,0.45); border-radius: 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .steer button.on { background: rgba(159,224,255,0.35); }
  /* portrait: picture on top, buttons in a row underneath */
  @media (orientation: portrait) {
    .wrap { display: grid; grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-content: start; }
    .screen { width: 100%; min-width: 0; border-width: 3px; }
    .pad.act { align-self: end; height: min(100%, 170px); grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: auto 1fr; }
    .pad.act .mute { grid-column: 1 / 4; }
    .pad button { font-size: 18px; }
  }
  /* landscape: big picture, buttons for the right thumb */
  @media (orientation: landscape) {
    .wrap { flex-direction: row; justify-content: center; align-items: stretch; }
    .screen { flex: 0 1 auto; align-self: center; min-width: 0; border-width: 3px; height: auto; aspect-ratio: 16 / 10;
      width: min(calc(100vw - 150px - env(safe-area-inset-left) - env(safe-area-inset-right)), calc((100dvh - 26px) * 1.6)); }
    .pad.act { width: 110px; flex: 0 0 auto; grid-template-rows: auto 1.4fr 1fr 1fr; }
  }
}
</style>

<div class="wrap">
  <div class="screen">
    <canvas id="game" width="480" height="300" aria-label="Blankis, spelyta"></canvas>
    <div class="steer" aria-label="Styr">
      <button data-key="left" aria-label="Styr vänster">&#9664;</button>

    <span class="keys"><b>MELLANSLAG</b> PIKA MED STAVEN / OK</span>
    <span class="keys"><b>1 2 3</b> KARTA VÄDER TIPS</span>

    <span>ÅK TILLBAKA TILL ELDEN OCH STANNA FÖR ATT AVSLUTA TUREN</span>

</div>

<script>
(() => {
'use strict';
const W = 480, H = 300;
const cv = document.getElementById('game');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const tripCv = document.createElement('canvas'); tripCv.width = W; tripCv.height = H;
const tripCtx = tripCv.getContext('2d');
// render at the screen's real resolution so text is sharp; game logic still uses W x H units
let RS = 1;
function sizeCanvas() {
  const r = cv.getBoundingClientRect();
  const want = Math.max(1, Math.min(4, Math.ceil((r.width || W) * (devicePixelRatio || 1) / W)));
  if (want === RS && cv.width === W * RS) return;
  RS = want;
  for (const [c, g] of [[cv, mainCtx], [tripCv, tripCtx]]) {
    c.width = W * RS; c.height = H * RS;
    g.setTransform(RS, 0, 0, RS, 0, 0); g.imageSmoothingEnabled = false;
  }
}
sizeCanvas();
addEventListener('resize', () => setTimeout(sizeCanvas, 50));
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

const C = {
  bg: '#0a121c', panel: '#0d1824', line: '#2e4560', text: '#eef4fa', dim: '#7f98b4',
  ice: '#9fe0ff', gold: '#f8d038', ok: '#78e878', bad: '#f85848', warn: '#f8a838',
  me: '#e04040', pal: '#f0c030'
};

// ---------- helpers ----------
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, f) => a + (b - a) * f;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
function hash(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y, s = 0) => vnoise(x, y, s) * 0.5 + vnoise(x * 2.1, y * 2.1, s + 7) * 0.3 + vnoise(x * 4.3, y * 4.3, s + 13) * 0.2;
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

function txt(s, x, y, col = C.text, align = 'left', size = 8) {
  ctx.font = '600 ' + (size + 1) + 'px ' + FONT;
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillText(s, x + 0.6, y + 0.6);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function wrap(s, max) {
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    if ((line + ' ' + w).trim().length > max) { out.push(line); line = w; }
    else line = (line + ' ' + w).trim();
  }
  if (line) out.push(line);
  return out;
}
function box(x, y, w, h, fill = C.panel, edge = C.line) {
  ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 2, w, h);
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = edge;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
}
function bar(x, y, w, h, f, col) {
  ctx.fillStyle = '#000'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = '#1a2838'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, Math.round(w * clamp(f, 0, 1)), h);
}

// ---------- constants ----------
const MS = 25;            // map: meters per pixel
const MW = 300, MH = 278; // map size in px
const SS = 1;             // rink: meters per pixel
const TS = 9;             // time compression on the ice (screen speed close to the old map scale)
const TS_RESQ = 3;        // slower motion during rescue so you can stop at the right distance
const STROKE = 1.0;       // seconds per skating stroke (one long glide per push)
const CLOCK = 20;         // the day's clock runs faster still
const TOURS = 5;
const DAYS = ['SÖN', 'MÅN', 'TIS', 'ONS', 'TOR', 'FRE', 'LÖR'];
const BANDS = [0.04, 0.25, 0.5, 0.75, 1];

// surface types
const SURF = [
  { n: 'BLANKIS',      vmax: 9.5, fr: 0.03, mult: 3,   col: C.ice },
  { n: 'OK IS',        vmax: 7.5, fr: 0.06, mult: 2,   col: C.ok },
  { n: 'SNÖIS',        vmax: 4.8, fr: 0.16, mult: 1,   col: C.warn },
  { n: 'TUNT SNÖ',     vmax: 5.5, fr: 0.12, mult: 1,   col: C.warn },
  { n: 'SNÖTÄCKT',     vmax: 3.4, fr: 0.35, mult: 0.5, col: C.bad },
  { n: 'DJUPSNÖ',      vmax: 2.0, fr: 0.8,  mult: 0.3, col: C.bad },
  { n: 'ÖPPET VATTEN', vmax: 0,   fr: 1,    mult: 0,   col: C.bad },
  { n: 'VASS',         vmax: 2.4, fr: 1.2,  mult: 0.3, col: C.warn },
  { n: 'STEN',         vmax: 0,   fr: 1,    mult: 0,   col: C.warn },
  { n: 'LAND',         vmax: 0,   fr: 1,    mult: 0,   col: C.dim }
];
const NAMES_BIG = ['LÅNGSJÖN', 'DJUPSJÖN', 'BJÖRKSJÖN', 'KVARNSJÖN', 'ÄLGSJÖN', 'HÄLLSJÖN', 'STORSJÖN', 'NORRSJÖN', 'LOMSJÖN', 'ABBORRSJÖN', 'SKOGSSJÖN', 'KROKSJÖN', 'GRANSJÖN', 'HÖKSJÖN'];
const NAMES_SMALL = ['LILLTJÄRN', 'SVARTTJÄRN', 'MOSSTJÄRN', 'GÄDDTJÄRN', 'RÄVTJÄRN', 'ORRTJÄRN', 'TRANTJÄRN', 'HUMMELTJÄRN', 'KÄLLTJÄRN', 'MYRTJÄRN'];

// ---------- lakes ----------
function lakeR(L, th) {
  return L.R * (1 + L.a2 * Math.sin(2 * th + L.p2) + L.a3 * Math.sin(3 * th + L.p3) + L.a5 * Math.sin(5 * th + L.p5));
}
// relative depth 0..1 at (x,y) meters from lake center, -1 = land
function depthRel(L, x, y) {
  const th = Math.atan2(y, x);
  const q = Math.hypot(x, y) / lakeR(L, th);
  if (q >= 1) return -1;
  let dr = Math.pow(1 - q, 0.75) * (0.8 + 0.2 * Math.sin(th + L.dp));
  for (const I of L.islands) {
    const iq = Math.hypot(x - I.x, y - I.y) / I.r;
    if (iq < 1) return -1;
    if (iq < 2.2) dr *= (iq - 1) / 1.2;
  }
  return clamp(dr, 0, 1);
}
const compass = a => { const d = ((a * 180 / Math.PI) + 360 + 22.5) % 360; return ['Ö', 'SÖ', 'S', 'SV', 'V', 'NV', 'N', 'NÖ'][Math.floor(d / 45)]; };

function makeLake(Rm, name) {
  const L = {
    R: Rm, name,
    a2: R(0.08, 0.3), a3: R(0, 0.14), a5: R(0, 0.06),
    p2: R(0, 6.28), p3: R(0, 6.28), p5: R(0, 6.28), dp: R(0, 6.28),
    islands: [], springs: [], mouths: []
  };
  L.rmax = 0;
  for (let i = 0; i < 64; i++) L.rmax = Math.max(L.rmax, lakeR(L, i / 64 * Math.PI * 2));
  if (Rm > 380) for (let k = RI(0, 2); k > 0; k--) {
    const a = R(0, 6.28), rr = R(0.35, 0.65) * lakeR(L, a);
    L.islands.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr, r: Rm * R(0.05, 0.1) });
  }
  // depth: small lakes can still be deep
  L.maxD = pick([R(2, 4), R(3.5, 7), R(6, 12), R(10, 22)]);
  if (Rm > 500 && Math.random() < 0.5) L.maxD += R(4, 10);
  L.maxD = Math.round(L.maxD);
  // inflow / outflow
  if (Math.random() < 0.6) L.mouths.push({ ang: R(0, 6.28), out: false, kind: 'BÄCK', Rm: 70 });
  if (Math.random() < 0.75) {
    let a; do { a = R(0, 6.28); } while (L.mouths.some(m => Math.abs(angDiff(m.ang, a)) < 1.4));
    const big = Rm > 400;
    L.mouths.push({ ang: a, out: true, kind: big ? 'Å' : 'BÄCK', Rm: big ? 100 : 70 });
  }
  for (const m of L.mouths) { const r = lakeR(L, m.ang); m.x = Math.cos(m.ang) * r; m.y = Math.sin(m.ang) * r; }
  for (let k = RI(0, 2); k > 0; k--) {
    const a = R(0, 6.28), rr = R(0.2, 0.75) * lakeR(L, a);
    const sp = { x: Math.cos(a) * rr, y: Math.sin(a) * rr };
    if (depthRel(L, sp.x, sp.y) > 0) L.springs.push(sp);
  }
  L.hygge = Math.random() < 0.3;
  L.exposure = clamp(clamp((Rm - 180) / 550, 0, 1) * 0.8 + (L.hygge ? 0.3 : 0), 0, 1);
  // area and mean depth by sampling
  let n = 0, sum = 0; const st = L.rmax / 30;
  for (let y = -L.rmax; y <= L.rmax; y += st) for (let x = -L.rmax; x <= L.rmax; x += st) {
    const d = depthRel(L, x, y); if (d >= 0) { n++; sum += d; }
  }
  L.area = Math.round(n * st * st / 10000);
  L.meanD = Math.max(0.6, Math.round(sum / n * L.maxD * 10) / 10);
  return L;
}

function genLakes() {
  for (let attempt = 0; attempt < 50; attempt++) {
    const sizes = shuffle([R(150, 220), R(170, 280), R(230, 380), R(320, 500), R(450, 700), R(200, 420)]).slice(0, RI(5, 6));
    const big = shuffle(NAMES_BIG.slice()), small = shuffle(NAMES_SMALL.slice());
    const out = [];
    let ok = true;
    for (const s of sizes) {
      const L = makeLake(s, s < 260 ? small.pop() : big.pop());
      const rp = L.rmax / MS;
      let placed = false;
      for (let tries = 0; tries < 200 && !placed; tries++) {
        const mx = R(rp + 6, MW - rp - 6), my = R(rp + 6, MH - rp - 6);
        if (out.some(o => Math.hypot(o.mx - mx, o.my - my) < o.rmax / MS + rp + 14)) continue;
        L.mx = mx; L.my = my; placed = true;
      }
      if (!placed) { ok = false; break; }
      out.push(L);
    }
    if (ok) { out.sort((a, b) => a.mx - b.mx); out.forEach((L, i) => L.num = i + 1); return out; }
  }
  return [];
}

// ---------- weather & ice simulation ----------
function genWeather() {
  const regimes = {
    mild:  () => ({ T: R(0.5, 4), snow: 0, rain: Math.random() < 0.4 ? R(1, 6) : 0, wind: R(2, 7) }),
    cold:  () => ({ T: R(-12, -3), snow: 0, rain: 0, wind: R(0, 4) }),
    snow:  () => ({ T: R(-5, -1), snow: R(2, 12), rain: 0, wind: R(2, 6) }),
    windy: () => ({ T: R(-7, -2), snow: Math.random() < 0.3 ? R(1, 3) : 0, rain: 0, wind: R(8, 14) }),
    thaw:  () => ({ T: R(1, 4), snow: 0, rain: Math.random() < 0.6 ? R(1, 8) : 0, wind: R(3, 8) })
  };
  const W8 = [['cold', 0.36], ['snow', 0.2], ['windy', 0.12], ['thaw', 0.17], ['mild', 0.15]];
  const days = [];
  for (let k = RI(1, 2); k > 0; k--) days.push(regimes.mild());
  let last = 'mild';
  while (days.length < 10) {
    let r = Math.random(), kind = 'cold';
    for (const [k, w] of W8) { if ((r -= w) <= 0) { kind = k; break; } }
    if (kind === last) continue;
    last = kind;
    const len = kind === 'cold' ? RI(1, 4) : RI(1, 2);
    for (let i = 0; i < len && days.length < 10; i++) days.push(regimes[kind]());
  }
  days.push({ T: R(-8, -2), snow: 0, rain: 0, wind: R(0, 3), today: true });
  for (const d of days) {
    d.T = Math.round(d.T * 10) / 10;
    d.snow = Math.round(d.snow); d.rain = Math.round(d.rain); d.wind = Math.round(d.wind);
    if (d.snow > 0 && d.T > 0.5) d.T = -0.5;
    d.lo = Math.round(d.T - R(1.5, 4)); d.hi = Math.round(d.T + R(1, 3.5));
    d.sky = d.today ? 'sun' : d.snow > 0 ? 'snow' : d.rain > 0 ? 'rain' : (d.T < -3 && d.wind < 5 && Math.random() < 0.7) ? 'sun' : 'cloud';
  }
  return days;
}

function simDay(s, d, L, di) {
  if (s.h + s.w <= 0) {                      // open water
    if (d.T > 0) s.Q = Math.min(s.Q0, s.Q + d.T * 0.6 + d.rain * 0.1);
    else s.Q -= -d.T * (1 + 0.05 * d.wind);
    s.Q -= d.snow * 0.15;
    const windBlock = d.wind * (0.4 + L.exposure) * s.rel > 5;
    if (s.Q <= 0 && d.T < -0.5 && !windBlock) {
      s.h = 1 + -d.T * 0.15; s.w = 0; s.snow = 0;
      s.rough = d.snow > 1 ? 0.6 : 0; s.frozeDay = di; s.ev.push(['frys', di]);
    }
    if (s.Q < 0) s.Q = 0;
    return;
  }
  if (d.snow > 0) {                          // snow on ice
    s.snow += d.snow; s.lastSnow = di;
    if (s.snow > 0.9 * (s.h + s.w)) {        // ice pushed under, water floods the snow
      s.w += s.snow * 0.4; s.snow = 0; s.rough = Math.max(s.rough, 0.85); s.ev.push(['modd', di]);
    }
  }
  if (d.wind > 7 && s.snow > 0) s.snow *= 1 - 0.6 * L.exposure;
  if (d.T < 0) {
    const ins = 1 / (1 + s.snow / 3);
    s.h = Math.sqrt(s.h * s.h + 3.5 * -d.T * ins);
  } else {
    let melt = d.T * 2.5 + d.rain * 0.4;
    if (s.snow > 0) {
      s.snow -= melt;
      if (s.snow <= 0) { melt = -s.snow * 0.3; s.snow = 0; s.rough = Math.max(s.rough, 0.35); s.ev.push(['tö', di]); }
      else melt = 0;
    }
    let m = melt * 0.2;
    const dw = Math.min(s.w, m); s.w -= dw; m -= dw;
    s.h -= m;
    if (s.h + s.w < 0.6) { s.h = 0; s.w = 0; s.snow = 0; s.rough = 0; s.Q = 1; s.ev.push(['öppen', di]); }
  }
}
function simLake(L, days) {
  L.bands = BANDS.map(b => {
    const ld = Math.max(0.3, b * L.maxD);
    const Q0 = 2.6 * (0.35 * L.meanD + 0.65 * ld) + 1.5;
    return { rel: b, Q: Q0, Q0, h: 0, w: 0, snow: 0, rough: 0, ev: [], frozeDay: -1 };
  });
  days.slice(0, 10).forEach((d, i) => { for (const s of L.bands) simDay(s, d, L, i); });
}
const strength = s => s.h + 0.5 * s.w;
function surfClass(s) {
  if (s.h + s.w <= 0) return 6;
  if (s.snow >= 6) return 5;
  if (s.snow >= 2) return 4;
  if (s.snow >= 0.7) return 3;
  if (s.rough >= 0.7) return 2;
  if (s.rough >= 0.3) return 1;
  return 0;
}
function scenarioOk(ls) {
  let good = 0, trap = 0; const cls = new Set();

function drawSkater(sx, sy, a, col, ph, v, scale = 1) {
  ctx.save();
  ctx.translate(Math.round(sx) + 0.5, Math.round(sy) + 0.5);
  ctx.rotate(a); ctx.scale(scale, scale);
  // ph: whole part = which leg pushes, fraction = progress through the stroke
  const side = (Math.floor(ph) & 1) ? 1 : -1, f = ph - Math.floor(ph);
  const push = v > 0.5 && f < 0.45 ? Math.sin(f / 0.45 * Math.PI) : 0;
  const lean = v > 0.5 ? -side * 0.7 : 0;   // body over the gliding skate
  ctx.fillStyle = '#d8e0e8';
  const glideY = side < 0 ? 1.5 : -2.5, pushY = side < 0 ? -2.5 : 1.5;
  ctx.fillRect(-2, glideY, 6, 1);
  ctx.fillRect(-2 - push * 3, pushY + (pushY < 0 ? -1 : 1) * push * 2.5, 6, 1);
  ctx.fillStyle = '#284060'; ctx.fillRect(-4, -2 + lean, 2, 4);   // backpack
  ctx.fillStyle = col; ctx.fillRect(-2, -2 + lean, 4, 4);
  ctx.fillStyle = '#f0e0c8'; ctx.fillRect(1, -1 + lean, 2, 2);
  ctx.fillStyle = '#a07a40'; ctx.fillRect(1, 2.5, 6, 1);   // pole
  ctx.restore();
}

  ctx.fillStyle = col; ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 3);
  ctx.fillStyle = '#f0e0c8'; ctx.fillRect(Math.round(x), Math.round(y) - 1 + (Math.floor(t * 4) & 1), 1, 1);
  ctx.fillStyle = '#e8f4ff';
  ctx.fillRect(Math.round(x + Math.cos(a) * 4), Math.round(y + Math.sin(a) * 4), 1, 1);
}
function drawSkateHud() {
  const here = sample(P.x, P.y), S = SURF[here.surf];
  ctx.fillStyle = 'rgba(6,12,20,0.85)'; ctx.fillRect(0, 0, W, 16);
  txt(run.L.name, 4, 4, C.gold);
  txt(clockStr(run.clock), 140, 4, run.clock > 14.5 * 3600 ? C.warn : C.text);
  txt((run.dist / 1000).toFixed(1) + ' KM', 196, 4);
  txt(Math.round(run.pts) + ' P', 270, 4, C.ice);
  txt(Math.round(P.v * 3.6) + ' KM/H', 334, 4);
  txt(S.n, W - 4, 4, S.col, 'right');
  if (run.trip) { ctx.fillStyle = 'rgba(6,12,20,0.9)'; ctx.fillRect(0, 16, 92, 14); txt('×2 SVAMPBONUS', 4, 19, 'hsl(' + Math.floor(t * 300 % 360) + ',100%,70%)'); }
  // minimap
  const mm = 64, mx = W - mm - 4, my = 20;
  ctx.fillStyle = '#000'; ctx.fillRect(mx - 1, my - 1, mm + 2, mm + 2);
  ctx.drawImage(rink.mini, mx, my, mm, mm);
  const dot = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(mx + Math.round((x + rink.ext) / (2 * rink.ext) * mm) - 1, my + Math.round((y + rink.ext) / (2 * rink.ext) * mm) - 1, 3, 3); };
  if (Math.floor(t * 3) & 1) dot(rink.start.fx, rink.start.fy, '#f86828');
  dot(K.x, K.y, C.pal); dot(P.x, P.y, C.me);
}
function drawMsgs() {
  msgs.forEach((m, i) => {
    const y = H - 14 - (msgs.length - 1 - i) * 13;
    ctx.fillStyle = 'rgba(6,12,20,0.85)'; ctx.fillRect(0, y - 3, W, 13);
    txt(m.text, W / 2, y, m.col, 'center');
  });
}
function drawTapHalves(word) {
  // two big tap zones, the one you should press next pulses
  const r = resq, next = r.last === 'left' ? 'right' : r.last === 'right' ? 'left' : null;
  for (const side of ['left', 'right']) {
    const x = side === 'left' ? 0 : W / 2;
    const hit = altTap && altTap.k === side && t - altTap.t < 0.12;
    const want = next === side || (!next);
    ctx.fillStyle = hit ? 'rgba(159,224,255,0.35)' : want ? 'rgba(159,224,255,' + (0.08 + 0.06 * Math.sin(t * 12)) + ')' : 'rgba(0,0,0,0.12)';
    ctx.fillRect(x, 0, W / 2, H);
    txt(side === 'left' ? '◀ ' + word : word + ' ▶', x + W / 4, H - 52, want ? C.ice : C.dim, 'center', 14);
  }
  ctx.fillStyle = 'rgba(159,224,255,0.4)'; ctx.fillRect(W / 2, 0, 1, H);
}
function drawRescueUi() {
  const r = resq;
  if (isTouch && altPhase()) drawTapHalves(r.who === 'me' ? 'HUGG' : 'DRA');
  box(8, 22, 150, r.who === 'pal' ? 52 : 64, 'rgba(6,12,20,0.9)', C.bad);
  txt(r.who === 'pal' ? 'KAMRATRÄDDNING' : 'SJÄLVRÄDDNING', 14, 28, C.bad);
  txt('KRAFT', 14, 42, C.dim);
  bar(62, 42, 88, 7, r.cold / (r.who === 'pal' ? 45 : 35), r.cold < 10 ? C.bad : C.warn);
  if (r.who === 'me') {
    txt('UPPE', 14, 56, C.dim); bar(62, 56, 88, 7, r.prog, C.ok);
    txt(isTouch ? (r.phase === 'turn' ? '◀ ▶ VÄND  SKJUT HUGG' : 'VÄNSTER / HÖGER VARANNAN') : (r.phase === 'turn' ? '← → VÄND  ↑ HUGG' : '← → HUGG  ↓ VÄND OM'), 14, 68, C.text);
    if (r.phase === 'turn') {
      // show the direction you face
      const [vx, vy] = camera(), px = toPx(P.x) - vx, py = toPx(P.y) - vy;
      ctx.fillStyle = C.ice;
      for (let k = 6; k < 16; k++) ctx.fillRect(Math.round(px + Math.cos(P.a) * k), Math.round(py + Math.sin(P.a) * k), 1, 1);
    }
  } else {
    if (r.phase === 'approach') txt('AVSTÅND ' + Math.round(r.dist || 0) + ' M', 14, 56, (r.dist >= 7 && r.dist <= 18) ? C.ok : C.warn);
    else if (r.phase === 'pull') { txt('DRA', 14, 56, C.dim); bar(62, 56, 88, 7, r.prog, C.ok); }
    if (r.phase === 'aim') {
      const zone = 0.3 - (r.dist - 7) * 0.012, cx = W / 2, w = 160, y = 200;
      box(cx - w / 2 - 6, y - 16, w + 12, 34, 'rgba(6,12,20,0.9)', C.ice);
      txt('KASTA LINAN', cx, y - 11, C.ice, 'center');
      ctx.fillStyle = '#3a2020'; ctx.fillRect(cx - w / 2, y + 2, w, 8);
      ctx.fillStyle = '#207030'; ctx.fillRect(Math.round(cx - zone * w / 2), y + 2, Math.round(zone * w), 8);
      const m = Math.sin(r.aimT * 3.3);
      ctx.fillStyle = r.miss > 0 ? C.dim : '#fff'; ctx.fillRect(Math.round(cx + m * w / 2) - 1, y, 3, 12);
    }
  }
}

// distance per ice type: a colored bar plus labels like "BLANKIS 2.1 KM · 630 P"
function drawSurfSplit(list, y) {
  const x0 = 70, bw = W - 140, tot = list.reduce((a, e) => a + e.m, 0) || 1;
  let x = x0;
  for (const e of list) {
    const w = e.m / tot * bw;
    ctx.fillStyle = SURF[e.i].col; ctx.fillRect(x, y, Math.max(1, w), 5);
    x += w;
  }
  y += 8;
  ctx.font = '600 9px ' + FONT;
  let lx = x0;
  for (const e of list) {
    const km = e.m >= 1000 ? (e.m / 1000).toFixed(1) + ' KM' : Math.round(e.m / 10) * 10 + ' M';
    const s = SURF[e.i].n + ' ' + km + ' · ' + e.p + ' P';
    const w = ctx.measureText(s).width + 12;
    if (lx + w - 12 > x0 + bw && lx > x0) { lx = x0; y += 11; }
    txt(s, lx, y, SURF[e.i].col); ctx.font = '600 9px ' + FONT;
    lx += w;
  }
  return y + 13;
}
function drawResult() {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const r = result;
  const title = { ok: 'TUREN ÄR SLUT', dark: 'MÖRKRET FÖLL', open: 'ÖPPET VATTEN', pal: 'KOMPISEN RÄDDAD!', self: 'DU TOG DIG UPP!', fail: 'DET GICK INTE' }[r.kind];
  txt(title, W / 2, 10, r.kind === 'fail' || r.kind === 'open' ? C.bad : C.gold, 'center', 16);
  let y = 34;
  if (r.kind === 'fail') {
    for (const l of wrap(run.endWhy === 'both' ? 'NI HAMNADE BÅDA I VATTNET. RÄDDNINGSTJÄNSTEN FICK HJÄLPA ER UPP. GÅ ALDRIG FRAM TILL HÅLET!' : 'KYLAN TOG KRAFTEN. RÄDDNINGSTJÄNSTEN KOM TILL UNDSÄTTNING. ALLA KOM HEM, MEN SÄSONGEN ÄR ÖVER.', 56)) { txt(l, W / 2, y, C.text, 'center'); y += 11; }
    y += 4;
  }
  for (const [k, v, col] of r.lines) {
    txt(k, 70, y, col); txt(v, W - 70, y, col, 'right'); y += 12;
    if (k === 'STRÄCKA' && r.surf.length) y = drawSurfSplit(r.surf, y);
  }
  ctx.fillStyle = C.line; ctx.fillRect(70, y, W - 140, 1); y += 5;
  txt('DENNA TUR', 70, y, C.gold); txt(String(r.sum), W - 70, y, C.gold, 'right'); y += 12;
  txt('TOTALT', 70, y, C.ice); txt(String(total), W - 70, y, C.ice, 'right'); y += 18;
  // facit
  txt('FACIT: SÅ LÅG ISEN', 8, y, C.ice); y += 12;
  txt('SJÖ', 26, y, C.dim); txt('STRAND', 210, y, C.dim, 'right'); txt('MITT', 270, y, C.dim, 'right'); txt('YTA', 290, y, C.dim); y += 11;
  for (const L of lakes) {
    const chosen = r.L === L;
    const m = L.bands[2], c = surfClass(m);
    const sh = strength(L.bands[0]), mid = strength(L.bands[3]);
    const col = chosen ? C.gold : C.text;
    txt((chosen ? '>' : ' ') + L.num + ' ' + L.name, 8, y, col);
    txt(sh > 0 ? Math.round(sh) + 'CM' : 'ÖPPET', 210, y, sh < 5 ? C.bad : col, 'right');
    txt(mid > 0 ? Math.round(mid) + 'CM' : 'ÖPPET', 270, y, mid < 5 ? C.bad : col, 'right');
    txt(SURF[c].n, 290, y, SURF[c].col);
    y += 11;
  }
  y += 4;
  for (const l of wrap(r.reason, 57)) { txt(l, 8, y, C.dim); y += 11; }
  if (timer > 1 && (Math.floor(t * 2.5) & 1)) txt(r.over || tour >= TOURS ? 'VIDARE' : 'NÄSTA TUR ▶', W - 8, H - 12, C.text, 'right');
}
function drawSeason() {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  txt('SÄSONGEN ÄR SLUT', W / 2, 60, C.ice, 'center', 16);
  txt('TOTALT ' + total + ' POÄNG', W / 2, 110, C.gold, 'center');
  txt(result.newHi ? 'NYTT REKORD!' : 'REKORD ' + hi, W / 2, 132, result.newHi ? C.ok : C.dim, 'center');
  txt('ÅK ALDRIG ENSAM. HA ALLTID ISDUBBAR,', W / 2, 180, C.dim, 'center');
  txt('KASTLINA OCH TORRSÄCK MED DIG.', W / 2, 192, C.dim, 'center');
  if (timer > 1 && (Math.floor(t * 2.5) & 1)) txt(isTouch ? 'TRYCK PÅ SKÄRMEN' : 'TRYCK MELLANSLAG', W / 2, 250, C.text, 'center');
}

function draw() {
  if (state === 'title') drawTitle();
  else if (state === 'plan') drawPlan();
  else if (state === 'skate' || state === 'rescue') {
    const k = tripK();
    if (k > 0) {
      ctx = tripCtx; drawRinkScene(); ctx = mainCtx; tripComposite(k);
      const [vx, vy] = camera();
      const px = toPx(P.x) - vx, py = toPx(P.y) - vy;
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(Math.round(px) - 5, Math.round(py) - 5, 11, 11);
      drawSkater(Math.round(px), Math.round(py), P.a, C.me, P.ph, P.v);
    }
    else drawRinkScene();
    drawSkateHud();
    if (state === 'rescue') drawRescueUi();
    drawMsgs();
  }
  else if (state === 'result') drawResult();
  else if (state === 'season') drawSeason();
  if (muted) txt('LJUD AV', W - 4, H - 10, C.dim, 'right');
}

function step(dt) {
  t += dt; timer += dt;
  for (const m of msgs) m.t -= dt;
  msgs = msgs.filter(m => m.t > 0);
  for (const p of pokes) p.life -= dt;
  pokes = pokes.filter(p => p.life > 0);
  parts = parts.filter(p => p.life > 0);
  if (state === 'skate') { updateSkate(dt); if (state === 'skate') { checkShrooms(); updateTrip(dt); } }
  else if (state === 'rescue') updateRescue(dt);
  sitarTick();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); draw();
  if (document.body.dataset.state !== state) document.body.dataset.state = state;
  requestAnimationFrame(frame);
}
const go = () => requestAnimationFrame(t0 => { last = t0; frame(t0); });
go();
})();
</script>
